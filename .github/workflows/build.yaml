name: build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: setup-msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: msys2-devel base-devel autotools cocom diffutils gcc gettext-devel libiconv-devel make mingw-w64-cross-crt mingw-w64-cross-gcc mingw-w64-cross-zlib perl zlib-devel xmlto docbook-xsl

      - name: Build
        shell: msys2 {0}
        run: |
          (cd winsup && ./autogen.sh)
          ./configure --disable-dependency-tracking --with-msys2-runtime-commit="$GITHUB_SHA"
          make -j8

      - name: Install
        shell: msys2 {0}
        run: |
          make DESTDIR="$(pwd)"/_dest install

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: install
          path: _dest/

      - name: Package a minimal runtime
        run: |
          mkdir ${{ runner.temp }}\minimal-pkg -Force
          cp ${{ runner.temp }}\msys64\usr\bin\bash.exe ${{ runner.temp }}\minimal-pkg
          cp _dest/usr/bin/msys-2.0.dll ${{ runner.temp }}\minimal-pkg
          cp _dest/usr/bin/cygpath.exe ${{ runner.temp }}\minimal-pkg
          cp _dest/usr/bin/cygwin-console-helper.exe ${{ runner.temp }}\minimal-pkg

      - name: Upload the minimal set
        uses: actions/upload-artifact@v4
        with:
          name: minimal
          path: ${{ runner.temp }}\minimal-pkg

  generate-msys2-tests-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        uses: msys2/msys2-tests/gha-matrix-gen@main

  msys2-tests:
    needs: [build, generate-msys2-tests-matrix]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-msys2-tests-matrix.outputs.matrix) }}

    name: msys2-tests ${{ matrix.msystem }}-${{ matrix.cc }}
    runs-on: ${{ matrix.runner }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      FC: ${{ matrix.fc }}
    steps:
      - id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: ${{ matrix.packages }}

      - name: Add staging repo
        shell: msys2 {0}
        run: |
          sed -i '1s|^|[staging]\nServer = https://repo.msys2.org/staging/\nSigLevel = Never\n|' /etc/pacman.conf

      - name: Update using staging
        shell: pwsh
        run: |
          msys2 -c 'pacman --noconfirm -Suuy'
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          msys2 -c 'pacman --noconfirm -Suu'

      - name: Download msys2-runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: install
          path: ${{ steps.msys2.outputs.msys2-location }}

      - name: Replace the msys2-runtime with a patched one
        shell: cmd
        run: |
          @echo off
          set "src=${{ runner.temp }}\msys64\usr\bin"
          set "dest=${{ runner.temp }}\msys64\bin"
          if not exist "%dest%" mkdir "%dest%"

          for %%f in (bash.exe sh.exe msys-2.0.dll) do (
            move /y "%src%\%%f" "%dest%\"
          )

      - name: Patch launcher script to use /bin/bash instead of /usr/bin/bash
        shell: pwsh
        run: |
          # Search all drives rather than just that on which {{ runner.temp }} is located on
          $launcher = "${{ runner.temp }}".Split(":")[1] + "\setup-msys2\msys2.CMD"
          $drives = @('C'..'Z') | % { "${_}:" }
          foreach ($drive in $drives) {
            $path = $drive + $launcher
            if (Test-Path $path) {
              # String replace in the launcher script on this drive
              (Get-Content $path) -replace '(.*msys64)\\usr(\\bin\\bash.exe)', '$1$2' | Set-Content $path
              Get-Content $path
            }
          }

      - name: uname -a
        shell: msys2 {0}
        run: uname -a

      - name: Run tests
        uses: thomastan/msys2-tests@patched-tests


